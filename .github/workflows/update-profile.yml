name: Update profile

on:
  schedule:
    - cron: "17 9 * * *"        # todos los días ~06:17 Chile
  workflow_dispatch:            # botón "Run workflow"
  push:
    branches: [main]
    paths:
      - config.json
      - scripts/**
      - assets/photos/**
      - assets/fonts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuentes (recorte + medición)
        run: pip install fonttools brotli

      - name: Generar SVGs + README
        env:
          # PROFILE_TOKEN (opcional): PAT con read:user para incluir contribuciones privadas
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit
        run: |
          git config user.name  "joaco-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "chore(profile): sync $(date -u +%F)"
          git push
